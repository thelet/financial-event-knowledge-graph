description: >-
  Guidance on "adjusted revenue growth" - a phrase the company used and the ontology never
  declared. A guided figure that does not name a declared metric can never be compared with
  an actual, because there is no actual it belongs to. `guided_metric` must resolve.
expected_codes: [event_property_does_not_name_a_declared_concept]
