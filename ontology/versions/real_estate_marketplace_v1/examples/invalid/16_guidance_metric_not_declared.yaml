    occurred_on: "2024-02-15"
    assertion_type: guided
    participants:
      - role: reporter
        entity_id: opendoor
        entity_type: public_company
      - role: period
        entity_id: fy2024q1
        entity_type: fiscal_period
    properties:
      guided_metric: adjusted_revenue_growth
      low_value: "10"
      high_value: "12"
      unit: percent
    evidence:
      - evidence_kind: filing_metadata
        accession: "0001801169-24-000006"
