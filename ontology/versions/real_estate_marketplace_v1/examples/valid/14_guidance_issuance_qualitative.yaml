  Qualitative outlook - "we expect holding periods to lengthen". A real guidance statement
  with no number in it, recorded with `guided_metric` and neither bound. The contract permits
  it deliberately: coercing this into a range would mean inventing a figure the company never
  gave, which is worse than recording that the outlook was directional.
