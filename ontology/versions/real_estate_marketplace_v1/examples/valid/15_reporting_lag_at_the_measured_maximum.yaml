description: >-
  A FY2020 comparative column read out of a FY2022 10-K filed 1,045 days after the period
  ended - the widest lag in the run. Reporting lag in this direction is unbounded and always
  legitimate; the future-period rule refuses only the reverse, where a period ends after the
  filing that carries it.
