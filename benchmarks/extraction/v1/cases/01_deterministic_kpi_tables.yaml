# Clean multi-period KPI tables from earnings releases.
#
# These are the cases the deterministic table lane exists for. Each table has one metric per
# row and one period per column group, and the only real work is column alignment and scale.
# Values read off the cited passages on 2026-08-01.

cases:
  - case_id: kpi-table-q1-2025-current-column
    category: deterministic_kpi_table
    lane: tables
    reviewed: true
    document_id: norm:0001801169:0001801169-25-000037:q12025formxex991earningsre.htm
    passage_id: norm:0001801169:0001801169-25-000037:q12025formxex991earningsre.htm#p14
    notes: >-
      The plainest in-scope case, and the one that proves the scale rule. The table itself
      carries no scale; the declaration is in the preceding narrative passage. A lane that
      only looks inside the table gets every dollar figure wrong by a factor of a million
      and every count right, which is exactly the failure `scale` is scored separately for.
    scale_declaration:
      location: preceding_passage
      passage_id: norm:0001801169:0001801169-25-000037:q12025formxex991earningsre.htm#p13
      text: "(In millions, except percentages, homes sold, number of markets, homes purchased, and homes in inventory)"
    gold_claims:
      - metric_id: homes_sold
        value: 2946
        unit: homes
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
      - metric_id: homes_purchased
        value: 3609
        unit: homes
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
      - metric_id: housing_inventory_homes
        value: 7080
        unit: homes
        instant_date: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
        note: >-
          Row label says "(at period end)". An instant, not a duration - a lane that emits
          period_start/period_end here is wrong on `period` even with the right value.
      - metric_id: market_count
        value: 50
        unit: markets
        instant_date: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
      - metric_id: gaap_gross_margin
        value: 8.6
        unit: percent
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
        note: >-
          The magnitude and the `%` sigil are in two different cells. Excluded from the
          scale declaration by "except percentages".
      - metric_id: contribution_profit
        value: 54000000
        unit: USD
        currency: USD
        scale_applied: millions
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
        note: Printed as "54"; the scale comes from the preceding passage.
      - metric_id: contribution_margin
        value: 4.7
        unit: percent
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
      - metric_id: adjusted_ebitda
        value: -30000000
        unit: USD
        currency: USD
        scale_applied: millions
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
        note: Printed as "(30)". Parenthesised negatives are the sign case.
      - metric_id: adjusted_ebitda_margin
        value: -2.6
        unit: percent
        period_start: "2025-01-01"
        period_end: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
      - metric_id: pct_homes_on_market_gt_120_days
        value: 27
        unit: percent
        instant_date: "2025-03-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "March 31, 2025"
        population:
          definition_raw: 'Percentage of homes “on the market” for greater than 120 days (at period end)'
        note: >-
          The table label is a fourth wording, distinct from the three prose wordings in
          04_population_wording.yaml. It must be carried verbatim like the others.
    abstentions:
      - reason: UNAVAILABLE_REQUIRED_SOURCE_LANE
        detail: >-
          Rows "Revenue" (1,153), "Gross profit" (99) and "Inventory (at period end)"
          (2,362) are readable but belong to metrics whose first source lane is xbrl.
        metrics: [revenue, gaap_gross_profit, inventory_balance]
        required_lane: xbrl
      - reason: NO_MATCHING_METRIC
        detail: >-
          Rows "Net loss" (-85) and "Adjusted Net Loss" (-63) have no concept in
          real_estate_marketplace_v1. Inventing one is worse than skipping the row.

