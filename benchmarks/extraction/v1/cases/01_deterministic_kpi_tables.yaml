  - case_id: kpi-table-q4-2023-earnings
    category: deterministic_kpi_table
    lane: tables
    reviewed: true
    document_id: norm:0001801169:0001801169-24-000015:q42023formxex991earningsre.htm
    passage_id: norm:0001801169:0001801169-24-000015:q42023formxex991earningsre.htm#p16
    notes: >-
      A KPI table carrying both quarter and full-year column groups, so the same metric row
      yields two different period lengths. The 120-day row reads 18% for the quarter and 18%
      for the year because it is an instant at the same date - a lane that treats every
      column group as a duration will emit a full-year duration for a point-in-time stock.
    gold_claims:
      - metric_id: pct_homes_on_market_gt_120_days
        value: 18
        unit: percent
        instant_date: "2023-12-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "December 31, 2023"
        population:
          definition_raw: 'Percentage of homes “on the market” for greater than 120 days (at period end)'
      - metric_id: pct_homes_on_market_gt_120_days
        value: 55
        unit: percent
        instant_date: "2022-12-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "December 31, 2022"
        population:
          definition_raw: 'Percentage of homes “on the market” for greater than 120 days (at period end)'
      # Added at F0, when `recon-shareholder-letter-table-as-prose` was reclassified as
      # must-refuse. That case was the only gold coverage of `housing_inventory_homes` at
      # 2023-12-31, and it read the figure out of a *flattened* copy of this very table, in
      # the same quarter's EX-99.2. Here the parser kept the columns, so the same fact is
      # attributable rather than guessed — which is the point of the reclassification: the
      # fact keeps its benchmark, the unsafe way of reading it does not.
      - metric_id: housing_inventory_homes
        value: 5326
        unit: homes
        instant_date: "2023-12-31"
        subject_entity_id: opendoor
        subject_type: public_company
        source_lane: normalized_table
        assertion_type: reported
        column_label: "December 31, 2023"
        note: >-
          Row label says "(at period end)" — an instant, not a duration. The row also ends
          "5,326 12,788" under `Year Ended December 31, | 2023 | 2022`, so 5,326 is printed
          twice; with the columns intact both printings resolve to the same instant, which is
          exactly what the flattened copy could not do.
    abstentions:
      - reason: UNAVAILABLE_REQUIRED_SOURCE_LANE
        detail: 'Row "Inventory (at period end)" reads 1,775 / 4,460 but belongs to inventory_balance.'
        metrics: [inventory_balance]
        required_lane: xbrl

