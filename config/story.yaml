# Story agent configuration — V1_STORY_AGENT §10.2, §14, §15, and IMPLEMENTATION_STEPS §8b.
#
# NON-SECRET DEFAULTS ONLY, the same rule `config/graph.yaml` states. There is no credential
# here and there must never be one: `story/providers/public.py:from_config` **refuses** a
# `provider.api_key`, `api_token`, `authorization` or `token` key rather than reading it —
# inside the nested `provider.openai:` block as well as at the top level — and the gitignored
# repository-root `.env` is the only place one may live: `STORY_LLM_API_KEY` for the local
# server (which needs none) and `OPENAI_API_KEY` for OpenAI.
#
# This file is a digest input. `story/pipeline.py` hashes it into `config_hash`, which is a
# `story_run_id` input (§14), so every key below — including one this loader does not read —
# moves the run id when it changes. That is what makes `length_target` safe to keep here: it
# changes the writer's prompt text without changing `WRITER_PROMPT_VERSION`, and without the
# config hash nothing in the id would notice.
#
# **What is hashed is the *parsed* document, not the file's bytes**, and this comment said
# "as written" until 2026-08-18. `DemoConfig.config_hash` is
# `sha256(canonical_json(yaml.safe_load(text)))`, and `safe_load` drops comments — checked by
# mutating this header in memory and recomputing: `b8488b32076b9b1d…` either way, while the
# file's own sha256 moves. So a **key** nobody reads still moves the run id, and a **comment**
# does not. Both halves matter: the first is why an unread key is safe to add, the second is
# why the corrections below could be made without invalidating a committed artifact.
#
# **Scope.** This file serves the §8b demo path and nothing else. The production run lifecycle,
# the `discover`/`package`/`plan`/`draft`/`verify` CLI family and the research mode are deferred
# by §8b and have no keys here; adding one for a verb that does not exist would be a claim.

version: v1

# §15's provider block. Read by `story/providers/public.py:load_provider_config`, which layers
# `.env` and then the process environment over these values — `STORY_LLM_BASE_URL`,
# `STORY_LLM_MODEL`, `STORY_LLM_TIMEOUT_SECONDS`, `STORY_LLM_MAX_RETRIES`,
# `STORY_LLM_MAX_OUTPUT_TOKENS`, `STORY_LLM_CONTEXT_TOKENS`. The machine wins.
#
# These are the validated local runtime (LOCAL_RUNTIME_VALIDATED.md §1) and were re-verified
# against the running server on 2026-08-04: `GET /health` returns `{"status":"ok"}` and the
# planner answered in 10.4 s over this model.
#
# There is deliberately **no `temperature` key**. §15.1 pins it as `PINNED_TEMPERATURE = 0.0`
# at the call site because it is a digest input to every stored generation, and a value that
# could be edited here would silently re-key the whole replay store.
#
# S12 added three keys this block *may* carry and does not: `supports_temperature`,
# `reasoning_effort` and `store_responses`. All three mean nothing to the local server and
# `validated()` **refuses** them here rather than ignoring them — and until 2026-08-19 the
# loader never read them, so writing `reasoning_effort: high` below was silently dropped and the
# refusal could only be reached from a hand-built dataclass. It is read now, so a setting that
# means nothing fails on the first load instead of looking configured.
provider:
  # Which provider a call site that made no choice gets (MULTI_PROVIDER_OPENAI §4.2). `kind`
  # below still describes *this* block, the local server; `default` says which of the two
  # blocks is reached for. They are the same value today, and that is what keeps every existing
  # call site — the CLI, the demo API, every test — resolving Qwen with no edit.
  #
  # §11's open decision resolved: the *pipeline* default stays local, because the demo replays
  # a committed Qwen store and a default that missed it would need a live run to say anything.
  # `provider.openai.default_model` below is the other half of that decision.
  default: local_openai_compatible

  kind: local_openai_compatible
  base_url: http://127.0.0.1:8080
  model: Qwen3.5-9B-Q4_K_M.gguf
  context_tokens: 8192

  # 2048 rather than the module default of 1024: both call sites below ask for 2048, and a
  # configured ceiling below what the code requests would be a bound that never binds.
  max_output_tokens: 2048
  timeout_seconds: 120
  max_retries: 2

  # MULTI_PROVIDER_OPENAI §4.4. **No key, ever** — `from_config` refuses `api_key`, `api_token`,
  # `authorization` and `token` here exactly as it does above; `OPENAI_API_KEY` lives in `.env`.
  # `STORY_OPENAI_MODEL` overrides `default_model` from the environment, and an explicit
  # selection made through the interface overrides both.
  #
  # There is no `store_responses` key and no `temperature` key. `store: false` is unconditional
  # in the adapter (a request carries the whole evidence package, and this API's default is to
  # retain), and the temperature is `PINNED_TEMPERATURE` at the call site for the same reason it
  # is absent from the local block.
  openai:
    base_url: https://api.openai.com/v1
    default_model: gpt-5-nano
    timeout_seconds: 180
    max_retries: 2

    # 4096 and 128000 are this API's headroom rather than the local server's 2048/8192. Both
    # call sites still ask for 2048; the ceiling only has to be a ceiling.
    max_output_tokens: 4096
    context_tokens: 128000

    # `supports_temperature` is **measured, not inferred from the name** *(probed against the
    # live API 2026-08-19)*: `gpt-5-nano` answers `temperature: 0.0` with HTTP 400 `Unsupported
    # parameter: 'temperature' is not supported with this model`, while `gpt-4.1-mini` accepts
    # it. A model absent from this list cannot be selected — its answer to that question has
    # never been measured, and discovering it costs a failed request per run.
    #
    # The key is **dispatched on, not defaulted** *(corrected 2026-08-19)*. Deleting it entirely
    # resolves the two models `providers/public.py` names as constants, which is what a caller
    # with no config file gets; writing `models: []` takes OpenAI out of this build, and used to
    # hand back those two constants instead; anything that is not a list is a mistake and is
    # refused rather than quietly replaced by them.
    #
    # `gpt-5-nano` is the default and it is a reasoning model, so determinism is weaker than the
    # pinned local path's: no temperature reaches the wire and the manifest records
    # `temperature_sent: false` rather than a number nothing sent. `gpt-4.1-mini` is the
    # temperature-pinned alternative for a determinism-sensitive comparison. Reversing this is
    # one key.
    models:
      - id: gpt-5-nano          # verified present on the account 2026-08-19
        supports_temperature: false
        reasoning_effort: minimal
      - id: gpt-4.1-mini        # verified present on the account 2026-08-19
        supports_temperature: true

      # Added after the first live runs, because two small models failing the same deterministic
      # gates does not distinguish "OpenAI behaves differently" from "a small model does"
      # (MULTI_PROVIDER_OPENAI §10). Probed 2026-08-19: `reasoning.effort: medium` returns 200,
      # `temperature` returns the same 400 as every other gpt-5 model.
      # `none`, and measured rather than chosen: at `medium` the writer call spends its whole
      # 2048-token budget reasoning and returns `status: incomplete`
      # (`incomplete_details.reason: max_output_tokens`) with no message item at all — the same
      # failure LOCAL_RUNTIME_VALIDATED.md §4 recorded for llama.cpp with thinking enabled, from
      # the other direction. `max_tokens` is a `request_identity` input, so raising
      # `generation.writer_max_tokens` to suit one model would re-key every committed Qwen row;
      # the budget stays and the effort gives way. `minimal` is **not** accepted by this model
      # (it is by `gpt-5-nano`) — the effort vocabulary differs per model.
      - id: gpt-5.4
        supports_temperature: false
        reasoning_effort: none

# §11 and §12's two call sites. `planner_max_tokens` and `writer_max_tokens` are digest inputs
# to `request_identity`, so changing one re-keys that stage's stored generations by design.
generation:
  planner_max_tokens: 2048
  writer_max_tokens: 2048

  # How many times a refused call may be re-asked **with deterministic feedback added to the
  # prompt**. Never a blind retry: measured across the stored corpus, the local llama.cpp server
  # returned byte-identical answers to an identical request 4 times in 4, so re-asking an
  # unchanged prompt cannot change the outcome and only charges twice.
  #
  # These live here rather than in code because `story_run_id` does not count generations. Two
  # runs of one candidate — one repaired, one not — would mint the same id and the same
  # directory, and finalisation is `os.replace`. `config_hash` is a run-id input, so a bound
  # written here is a bound the id can see.
  #
  # 1 each, deliberately. A bound of one makes repair a straight-line second attempt rather than
  # a loop, which cannot oscillate and needs no convergence argument.
  max_planner_repairs: 1
  max_writer_repairs: 1

  # §12's `length_target`, in sentences. **4, and the code default is 5** — measured, not
  # preferred. Six live writer calls against the demo package, one per target, with the
  # planner's answer replayed so only this number moved.
  #
  # **Re-measured 2026-08-19 under `WRITER_PROMPT_VERSION` 2.0.0, and every target is now
  # refused** (DETERMINISTIC_FACT_TOOLS §9, six live `--live` runs against this candidate):
  #
  #   target 3  REJECTED  metric_surface_unresolved x3
  #   target 4  REJECTED  metric_surface_unresolved x3
  #   target 5  REJECTED  binding_rendering_is_not_one_numeral, metric_surface_unresolved x4
  #   target 6  REJECTED  binding_rendering_is_not_one_numeral, metric_surface_unresolved x4
  #   target 7  REJECTED  unbound_numeral x2, metric_surface_unresolved x3,
  #                       citation_reused_for_unrelated_claim x2, uncited_factual_sentence,
  #                       connective_sentence_carries_a_claim
  #   target 8  REJECTED  binding_rendering_is_not_one_numeral, metric_surface_unresolved x4
  #
  # The 2026-08-18 table this replaces read ACCEPTED on all six. What changed is the writer
  # prompt, not the model or the server: a control run of this candidate at `643935f` against
  # the same server is still accepted and still hashes to the values recorded at `d72ca64`.
  # Under 2.0.0 the 9B model writes the **unit** into `metric_surface` — `"percent"` — on every
  # target, and an ablation shows either of the prompt's two new sections is enough to cause it.
  # That is a defect in the writer prompt and is recorded as one; nothing here was tuned to
  # route around it, and no target accepts, so there is nothing to move to.
  #
  # **4 stays, and the reason is unchanged.** `length_target` is in the writer prompt, the prompt
  # is in `request_identity`, and `generation_stores` below is keyed on it: any other value
  # misses the committed rows and the offline demo would need another live re-record. Whether
  # the demo should run at 5 is a real question with a cost attached, and it is the
  # orchestrator's to decide, not this file's. *(Verified 2026-08-19: four consecutive live
  # target-4 runs return `generations.jsonl sha256 1e26754afa26930f…`, and
  # `test_live_the_qwen_writer_still_files_its_answer_under_the_committed_row` lands the live
  # writer answer on the committed key.)*
  length_target: 4

# §8b's demo path. `candidate_id` is not here on purpose — it is the one argument
# `python -m story demo` requires, so the manual selection is visible in the command a reader
# runs rather than buried in a file.
demo:
  # IMPLEMENTATION_STEPS §0, verified 2026-08-03 and re-verified by the freshness gate on
  # 2026-08-04: 14 of 14 checks pass against the loaded graph.
  graph_run_id: graph-v1-0483dc6b4b10

  # Under gitignored `data/`. Generated prose never leaves this directory: §14 forbids it in
  # `data/extraction_runs/`, in `data/graph_runs/` and in Neo4j.
  out_root: data/story_demo

  # The recorded answer stores the deterministic path replays, **one per provider** — real Qwen
  # responses, **re-recorded live on 2026-08-19** from the server named above under
  # `PLANNER_PROMPT_VERSION` 1.2.0 and `WRITER_PROMPT_VERSION` 2.1.0. Tracked, because §14 keeps
  # `tests/story/fixtures/` and "a small committed answer store for replay tests" in git; the
  # pattern is `benchmarks/extraction/v1/answers/*.jsonl`. `--live` ignores them and calls the
  # server.
  #
  # **Re-recorded and not re-keyed, and the difference is the whole of DETERMINISTIC_FACT_TOOLS
  # §9.** The two 2026-08-19 moves before it (`story-generation-v2` and `-v3`) were re-keys,
  # valid because the *request* was unchanged. S13 changed both prompts and both schemas — the
  # writer's 2.0.0 removes `calculation` — so the committed answers were answers to a different
  # question and carrying them across would have been a lie about what was asked.
  #
  # **The store was re-recorded a second time the same day**, for the writer prompt's 2.1.0
  # repair: the prompt was withholding the only surface that named `gaap_gross_margin`
  # unambiguously and was printing a derived figure in a spelling no sentence can carry. The
  # shipped recording's disposition is **accepted** again, with no finding, so
  # `generations_accepted_synthetic.jsonl` was deleted — a hand-authored accepted store standing
  # beside a real one asserts nothing the real one does not.
  # `generations_rejected_synthetic.jsonl` remains, and is that recording with one sentence's
  # two metrics swapped so a derived fact is stated backwards.
  #
  # **This mapping is authoritative** (MULTI_PROVIDER_OPENAI §5.3). A store is a *provider's*:
  # since `story-generation-v2` `request_identity` digests the adapter, so one provider's rows
  # are a guaranteed miss for another and there is no store that serves both.
  #
  # **There is deliberately no `openai:` row, and the OpenAI fixture exists anyway.** It was
  # re-recorded from a live `gpt-5.4` run on 2026-08-19 (twice, the second time under 2.1.0) and
  # is committed at
  # `tests/story/fixtures/story_demo/openai/generations.jsonl` — two rows, planner and writer,
  # reaching the deterministic verifier and refused by it. Adding the key here is what a reader
  # will want to do next, and it is refused on purpose: the shipped configuration having no
  # OpenAI store is what makes the demo UI answer `provider_requires_live` for OpenAI honestly,
  # and that answer is a tested guarantee (`test_demo_ui_api.py`, `test_story_demo.py:
  # test_a_provider_with_no_recorded_store_is_refused_by_name`). The fixture is for tests, and
  # the tests name its path themselves. A shipped demo that replayed a recorded OpenAI run
  # without a key would be claiming to have called an API it never called.
  generation_stores:
    local_openai_compatible: tests/story/fixtures/story_demo/local_openai_compatible/generations.jsonl

  # The pre-2026-08-19 scalar, kept readable for one release and **not** authoritative. It is
  # consulted only for `local_openai_compatible`, and only when the mapping above names no store
  # for it — `DemoConfig.generation_store_for` is the accessor, and every call site now goes
  # through it (`story/demo_ui/api.py` moved on 2026-08-19; the sentence that used to name it as
  # the reason this key survives is no longer true and is corrected rather than left standing).
  # What it is still doing here: it is the local provider's fallback, so a `config/story.yaml`
  # written before the mapping existed — or one whose mapping names no local store — still
  # resolves the same file. When nothing needs that compatibility, this key goes.
  generation_store: tests/story/fixtures/story_demo/local_openai_compatible/generations.jsonl

# §10.2's bounds are **not restated here.** `story/core/models.py:BudgetParameters` holds them,
# every field of it is already a digest input to both `package_id` and `story_run_id` through
# `digest_parts()`, and a second copy in YAML would be a second place to look for an answer
# that has not changed — the argument `story/context.py` makes for `data/graph_runs`.
