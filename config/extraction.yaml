# Extraction configuration. Scope lives here, never in code.
#
# Counts in comments are measured against the corrected corpus (2026-08-01): 294 documents,
# 12,442 passages, 1,935 table passages, PARSER_FALLBACK 0.
version: v1

paths:
  data_root: data
  normalization_catalog: data/normalization_catalog
  manifests_root: extraction_manifests

# The local generation provider. Every value is the runtime validated on 2026-08-01 and
# recorded in plans/extraction/LOCAL_RUNTIME_VALIDATED.md §1, not a guess.
#
# `enable_thinking: false` is not a tuning preference. With thinking on, a four-field schema
# request spent all 900 tokens reasoning and returned empty content; with it off the same
# request returned conformant JSON in 59 tokens (§4). Config loading REJECTS `true` with
# ProviderConfigurationError rather than warning, because the failure would present as an
# extraction failure rather than a budget one.
provider:
  kind: local_openai_compatible
  base_url: http://127.0.0.1:8080
  model: Qwen3.5-9B-Q4_K_M.gguf
  # 8,192 is deliberate, not a maximum: the Q1 2025 KPI table is ~2,657 characters before an
  # ontology candidate list is appended. Raising it is a later measurement.
  context_tokens: 8192
  max_output_tokens: 1024
  temperature: 0.0
  timeout_seconds: 120
  # Retries *after* the first attempt, so three attempts in total. Transport and 5xx only —
  # a schema-invalid answer is a model result and is never retried.
  max_retries: 2
  enable_thinking: false

# The local embedding provider, a second llama.cpp server so the two coexist. Every value is
# the runtime validated on 2026-08-01 and recorded in plans/extraction/STAGE_09_HYBRID_SCOPING.md
# §1.1, not a guess.
#
# `model` is the only statement of which model produced a cached vector: the server echoes
# back whatever `model` string the request carried, so the response cannot be believed about
# its own identity. It is part of the vector cache key for exactly that reason.
embedding:
  kind: local_openai_compatible
  base_url: http://127.0.0.1:8081
  model: Qwen3-Embedding-0.6B-f16.gguf
  dimensions: 1024
  timeout_seconds: 120
  max_retries: 2

# Which concepts a lane may consider for a passage.
#
# `strategy` stays `lexical`, and is the one key here with **no consumer yet**: step 10's
# composition root is what reads it to choose a scope. It is validated at load anyway — an
# unrecognised value raises rather than falling through to a default — so the key fails where
# it is written instead of at the first passage.
#
# Why `lexical`: STAGE_09 §7 sets four conditions for hybrid to become the default and the
# committed report `reports/hybrid_scope_v1.md` does not meet the first. Step 9's evidence is
# about *reachability* only; the lexical-vs-hybrid default is deferred to step 13, which
# decides it on step 11's narrative-extraction evidence. Changing this line is a founder
# decision that the report is written to inform, not a tuning knob.
#
# Both numbers below come from the measured similarity distribution and from no gold answer.
# The distribution is a mixture whose location moves with the text, so an absolute threshold
# can only floor and rank has to select:
#   top_k          how many concepts stand clear of a text's own field at its own mean + 3 sd,
#                  at its maximum over the measured texts.
#   min_similarity the pooled mean + 1 sd, rounded to two places, which excludes roughly 84%
#                  of all pairs by construction. A statement about the background, not a text.
# The figures behind both are in the report's distribution section, and
# `tests/extraction/test_hybrid_scoping.py` asserts that these two values *are* what those
# statistics produce — so an edit here that the distribution does not support fails the suite.
#
# There is no `cache_root`. STAGE_09 §3 promised one for a runtime cache under
# `data/embedding_cache/`; nothing in step 9 fills it, because the benchmark's committed
# vectors are what make the report regenerable offline. It arrives with the runtime that needs
# it rather than sitting here validating and doing nothing (STAGE_09 §11.5).
scoping:
  strategy: lexical
  hybrid:
    renderer_version: v1
    top_k: 2
    min_similarity: 0.45

selection:
  policy_version: v1

  lanes:
    tables:
      passage_kinds: [table]
      # Where reconciliation and KPI tables live: 1,803 of 1,935 table passages.
      document_types: [earnings_release, narrative_primary, structured_exhibit, supplemental]
      # A table's magnitude scale is declared inside the table in 65 of 74 KPI-bearing
      # tables and in the immediately preceding narrative passage in the other 9. A
      # candidate therefore carries its predecessor, or the second form is unreadable.
      carry_preceding_passage: true

    narrative:
      passage_kinds: [narrative]
      # Shareholder letters have exactly 1 table across 26 documents, so the letter lane is
      # prose or it is nothing.
      document_types: [earnings_release, shareholder_letter, narrative_primary]
      carry_preceding_passage: false

  # Excluded from the table lane. This is semantic routing, not a cost argument: contract
  # recitals and governance schedules carry no operating or non-GAAP metric, and admitting
  # them dilutes every candidate the lane does emit.
  #
  # The earlier justification here claimed material_agreement was 1,130 of 2,987 table
  # passages. That was an artifact of nine documents falling back to the lxml parser because
  # of the encoding defect. After the correction it holds 78 of 1,935. The obsolete 38%
  # figure is deliberately not repeated.
  excluded_document_types:
    contract_boilerplate: [material_agreement]     #  78 table passages
    governance_boilerplate: [governance]           #  44 table passages
    unsupported_document_type: [other]             #   9 table passages

  # A passage needs at least one of these to become a candidate. Alias evidence comes from
  # the ontology at run time; nothing here names a metric.
  signals:
    require_alias_evidence: true
    # Headings that make a passage worth reading even without an alias hit. Matched
    # case-insensitively against the heading path.
    heading_priors:
      - "FINANCIAL HIGHLIGHTS AND OPERATING METRICS"
      - "RECONCILIATION OF GAAP TO NON-GAAP MEASURES"
      - "Non-GAAP Financial Measures"
      - "Key Operating Metrics"
      - "Results of Operations"
    # Concepts always offered to a lane regardless of retrieval, so a scoping change can
    # never drop the subject of the corpus.
    stable_core_concepts: [opendoor, company, public_company]
