# Extraction configuration. Scope lives here, never in code.
#
# Counts in comments are measured against the corrected corpus (2026-08-01): 294 documents,
# 12,442 passages, 1,935 table passages, PARSER_FALLBACK 0.
version: v1

paths:
  data_root: data
  normalization_catalog: data/normalization_catalog
  manifests_root: extraction_manifests
  # One directory per run, named deterministically from the config hash, the corpus identity
  # and the ontology's definition hash — never from a timestamp, or two runs of the same
  # inputs could not be compared by path. Gitignored with the rest of `data/`.
  extraction_runs: data/extraction_runs

# What an integrated run may reach.
#
# `answer_stores` is the whole of the run's provider policy and it is deliberately declarative.
# A run **regenerates no provider answer**: it replays what was recorded, and a candidate whose
# request digest has no recorded answer is written down as `NO_STORED_ANSWER` rather than
# skipped. The corpus is far larger than the set of recorded answers, so most candidates are
# exactly that, and a bounded run that says so is the alternative to one that looks complete
# because it only visited what was cheap (STAGE_13 §1.1).
#
# **Why the paths point where they do, and what would be wrong about hiding it.** These files
# hold *answers* — what the model returned for a request digest — and hold no expected claim,
# no expected abstention and no case. They are the only recorded answers this repository has,
# and STAGE_13 §1.1 says the run replays them. The path is stated here, in configuration, and
# nowhere in code: four AST guards assert that nothing under `extraction/` imports or names the
# directory, and `tests/extraction/test_integrated_run.py` asserts that what a run loads
# contains no gold field of any kind. STAGE_13 §1's flat "the run must not read that directory
# for anything" and §1.1's "the committed answer stores replay" contradict each other; the
# contradiction is recorded in the plan and settled in favour of §1.1, narrowed to answers.
#
# A run with this list empty is a legal run. It extracts through the table lane, which needs no
# provider, and records `NO_STORED_ANSWER` for every model-backed candidate.
run:
  answer_stores:
    - benchmarks/extraction/v1/answers/narrative_v1.jsonl
    - benchmarks/extraction/v1/answers/event_v1.jsonl

# The local generation provider. Every value is the runtime validated on 2026-08-01 and
# recorded in plans/extraction/LOCAL_RUNTIME_VALIDATED.md §1, not a guess.
#
# `enable_thinking: false` is not a tuning preference. With thinking on, a four-field schema
# request spent all 900 tokens reasoning and returned empty content; with it off the same
# request returned conformant JSON in 59 tokens (§4). Config loading REJECTS `true` with
# ProviderConfigurationError rather than warning, because the failure would present as an
# extraction failure rather than a budget one.
provider:
  kind: local_openai_compatible
  base_url: http://127.0.0.1:8080
  model: Qwen3.5-9B-Q4_K_M.gguf
  # 8,192 is deliberate, not a maximum: the Q1 2025 KPI table is ~2,657 characters before an
  # ontology candidate list is appended. Raising it is a later measurement.
  context_tokens: 8192
  max_output_tokens: 1024
  temperature: 0.0
  timeout_seconds: 120
  # Retries *after* the first attempt, so three attempts in total. Transport and 5xx only —
  # a schema-invalid answer is a model result and is never retried.
  max_retries: 2
  enable_thinking: false

# The local embedding provider, a second llama.cpp server so the two coexist. Every value is
# the runtime validated on 2026-08-01 and recorded in plans/extraction/STAGE_09_HYBRID_SCOPING.md
# §1.1, not a guess.
#
# `model` is the only statement of which model produced a cached vector: the server echoes
# back whatever `model` string the request carried, so the response cannot be believed about
# its own identity. It is part of the vector cache key for exactly that reason.
embedding:
  kind: local_openai_compatible
  base_url: http://127.0.0.1:8081
  model: Qwen3-Embedding-0.6B-f16.gguf
  dimensions: 1024
  timeout_seconds: 120
  max_retries: 2

# Which concepts a lane may consider for a passage.
#
# `strategy` is read by `extraction/context.py`, the composition root, to choose a scope. It is
# validated at load — an unrecognised value raises rather than falling through to a default —
# so the key fails where it is written instead of at the first passage.
#
# **`lexical` is step 13's decision, and it is a weak decision that says so.** Recorded in
# `reports/scoping_decision_v1.{json,md}`, which is computed from the four committed evaluation
# reports by reporting code that no pipeline module can reach. The numbers behind it:
#
#   - the two scopes issue identical request digests on 13 of 14 narrative cases and on 3 of 3
#     event cases, so the whole extraction comparison rests on **1 of 17 reviewed cases**;
#   - hybrid reaches 1 required concept lexical misses, of 50 — 0.980 against 0.960 — and the
#     one gold claim it adds is **not clean**: it fails the population-wording dimension;
#   - hybrid causes no per-claim regression, so this is not a decision against hybrid on
#     quality; it is a decision that one unclean case is not enough evidence to move a default;
#   - hybrid cannot be run over the corpus offline at all. It embeds every candidate passage,
#     and this repository commits 26 case vectors and no corpus-scale cache.
#
# Changing this line is a founder decision, and the report is written to inform it rather than
# to close it. Raising `scoping.hybrid.top_k` to 3 takes required-concept recall to 1.000 in the
# committed sensitivity sweep and has never been scored against extraction quality; that, not
# the strategy switch, is the measurement most likely to change this answer.
#
# Both numbers below come from the measured similarity distribution and from no gold answer.
# The distribution is a mixture whose location moves with the text, so an absolute threshold
# can only floor and rank has to select:
#   top_k          how many concepts stand clear of a text's own field at its own mean + 3 sd,
#                  at its maximum over the measured texts.
#   min_similarity the pooled mean + 1 sd, rounded to two places, which excludes roughly 84%
#                  of all pairs by construction. A statement about the background, not a text.
# The figures behind both are in the report's distribution section, and
# `tests/extraction/test_hybrid_scoping.py` asserts that these two values *are* what those
# statistics produce — so an edit here that the distribution does not support fails the suite.
#
# There is no `cache_root`. STAGE_09 §3 promised one for a runtime cache under
# `data/embedding_cache/`; nothing in step 9 fills it, because the benchmark's committed
# vectors are what make the report regenerable offline. It arrives with the runtime that needs
# it rather than sitting here validating and doing nothing (STAGE_09 §11.5).
scoping:
  strategy: lexical
  hybrid:
    renderer_version: v1
    top_k: 2
    min_similarity: 0.45

selection:
  policy_version: v1

  lanes:
    tables:
      passage_kinds: [table]
      # Where reconciliation and KPI tables live: 1,803 of 1,935 table passages.
      document_types: [earnings_release, narrative_primary, structured_exhibit, supplemental]
      # A table's magnitude scale is declared inside the table in 65 of 74 KPI-bearing
      # tables and in the immediately preceding narrative passage in the other 9. A
      # candidate therefore carries its predecessor, or the second form is unreadable.
      carry_preceding_passage: true

    narrative:
      passage_kinds: [narrative]
      # Shareholder letters have exactly 1 table across 26 documents, so the letter lane is
      # prose or it is nothing.
      document_types: [earnings_release, shareholder_letter, narrative_primary]
      carry_preceding_passage: false

    # The event and relationship lane. Same passages as the narrative lane, and one rule
    # different: it requires **no metric alias evidence**.
    #
    # This closes the routing gap STAGE_12 §1.2 named and did not close. The narrative policy
    # requires a metric alias hit, which is the right rule for a lane that reads metric
    # observations and the wrong one for a lane whose menu is the declared event category
    # entire — all nineteen event types carry `aliases = ()`, so there is no surface for an
    # alias rule to match and requiring one excludes an event passage for having no metric in
    # it. Measured 2026-08-02: `ef20055426_ex99-1.htm#p2`, an 8-K reporting two executive
    # changes, scored `no_candidate_signal` under the narrative policy and was never offered to
    # any lane.
    #
    # `excluded_document_types` still applies, so contract and governance filings stay out.
    # That is deliberate and it is the plan's own bound: V1 §9 scopes events to a
    # representative subset and explicitly not to a sweep of the 64 material agreements.
    events:
      passage_kinds: [narrative]
      document_types: [earnings_release, shareholder_letter, narrative_primary]
      carry_preceding_passage: false
      require_alias_evidence: false

  # Excluded from the table lane. This is semantic routing, not a cost argument: contract
  # recitals and governance schedules carry no operating or non-GAAP metric, and admitting
  # them dilutes every candidate the lane does emit.
  #
  # The earlier justification here claimed material_agreement was 1,130 of 2,987 table
  # passages. That was an artifact of nine documents falling back to the lxml parser because
  # of the encoding defect. After the correction it holds 78 of 1,935. The obsolete 38%
  # figure is deliberately not repeated.
  excluded_document_types:
    contract_boilerplate: [material_agreement]     #  78 table passages
    governance_boilerplate: [governance]           #  44 table passages
    unsupported_document_type: [other]             #   9 table passages

  # A passage needs at least one of these to become a candidate. Alias evidence comes from
  # the ontology at run time; nothing here names a metric.
  signals:
    require_alias_evidence: true
    # Headings that make a passage worth reading even without an alias hit. Matched
    # case-insensitively against the heading path.
    heading_priors:
      - "FINANCIAL HIGHLIGHTS AND OPERATING METRICS"
      - "RECONCILIATION OF GAAP TO NON-GAAP MEASURES"
      - "Non-GAAP Financial Measures"
      - "Key Operating Metrics"
      - "Results of Operations"
    # Concepts always offered to a lane regardless of retrieval, so a scoping change can
    # never drop the subject of the corpus.
    stable_core_concepts: [opendoor, company, public_company]
