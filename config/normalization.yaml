# Normalization configuration. Any change alters config_hash and therefore derivation_id.
version: v1

paths:
  data_root: data
  manifests_root: normalization_manifests
  acquisition_catalog: data/catalog

parser:
  default: sec_html          # sec_html | lxml
  fallback: lxml
  mode: normal               # normal | fallback | comparison
  # Hard-failure trigger: parsed text below this fraction of a plain lxml extraction
  # of the same bytes (v1 plan section 4.5, condition 6).
  min_source_coverage: 0.60

  # Hard-failure trigger: genuine table-related content loss. All three conditions must
  # hold, because a low detection ratio on its own is normal -- SEC filings use tables for
  # page layout and that content usually survives as prose.
  #
  # Measured on the spike fixtures: EX-10.12 (137 tables, ratio 0.000, coverage 0.50)
  # trips it; DEF 14A 2026 (375 tables, ratio 0.005, coverage 1.00) and EX-3.1 (323
  # tables, ratio 0.015, coverage 1.00) do not, because their content survives as prose.
  # The FY2025 10-K has coverage 0.38 but ratio 0.807, so the ratio condition spares it.
  table_content_loss:
    min_source_tables: 20      # below this there is no "substantial table structure"
    max_detected_ratio: 0.10   # parser recognized <=10% of the source tables
    min_probe_coverage: 0.60   # below this, sampled table content is genuinely missing
    probe_count: 8
    min_probe_length: 18       # shorter cells match by accident

headings:
  # Filing labels beat font-weight (v1 plan section 4.6). Matched case-insensitively
  # against the whole normalized block text.
  filing_label_patterns:
    - '^part\s+[ivx]+\b'
    - '^item\s+\d+[a-z]?\b'
    - '^risk\s+factors$'
    - "^management'?s\\s+discussion"
    - '^signatures?$'
  min_font_weight: 600
  max_heading_chars: 200
  # Below this mean confidence the document degrades to a flat synthetic root.
  min_mean_confidence: 0.35

tables:
  wide_table_columns: 12
  # Layout classification requires ALL of these to hold; anything else is `unknown`.
  layout_max_rows: 1
  layout_max_cols: 1

passages:
  target_chars: 1500
  max_chars: 4000
  min_chars: 200
  # Block types that never become passage content.
  excluded_block_types: [page_header, page_number, heading, image]

selection:
  policy_file: config/selection_policy.yaml
  min_text_chars: 400        # below this AND no tables -> BELOW_TEXT_FLOOR

image_heavy:
  min_text_chars: 500
  min_chars_per_image: 200
